<!doctype html>

<meta charset="utf-8">

<title>Ctrl A Animation Index</title>
<meta name="description" content="Ctrl A — a hand-animated series on the principles of design. Final project at Bezalel Academy of Arts and Design.">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  figure { margin: 0; }

  body {
    background: #000000;
    padding: 6px;
    padding-top: calc(6px + env(safe-area-inset-top, 0px));
  }

  /* 24 studies = a complete 4 x 6 grid, no orphan row */
  .sheet {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* 2 x 12 on phones — still a complete grid, and the tiles stay readable */
  @media (max-width: 640px) {
    .sheet { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    max-width: 100%;
    overflow: hidden;
    background: #000000;
  }

  .cell video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .about-link {
    padding: 110px 16px 0;
    text-align: center;
  }

  .about-link a {
    color: #ffffff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 14px;
    text-decoration: none;
  }

  .about-link a:hover { color: #efb700; }
  .about-link a:focus-visible { outline: 2px solid #efb700; outline-offset: 4px; }

  .colophon {
    padding: 130px 16px calc(56px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
  }

  .colophon video {
    width: 100%;
    max-width: 460px;
    height: auto;
    display: block;
  }

  .sr {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>

<script>
  // Play only what is on screen: two dozen loops running at once would
  // saturate the connection and the decoder.
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        const v = e.target;
        if (e.isIntersecting) {
          if (v.preload === 'none') v.preload = 'auto';
          const p = v.play();
          if (p) p.catch(() => {});
        } else {
          v.pause();
        }
      }
    }, { threshold: 0.25, rootMargin: '200px 0px' });

    document.querySelectorAll('video').forEach((v) => io.observe(v));
  }
</script>
